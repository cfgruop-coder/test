<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка по памятке ОЗ.04</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<script>
  // тема выбирается до первой отрисовки, чтобы страница не мигала
  try {
    var savedTheme = localStorage.getItem("theme.v1");
    if (!savedTheme) {
      savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) {}
</script>
<style>
  .top-nav { margin-bottom: 16px; }
  .test-intro {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 5px solid var(--err); border-radius: var(--radius);
    box-shadow: var(--shadow-2); padding: 18px 20px; margin-bottom: 18px;
  }
  .test-intro h1 { margin: 0 0 6px; font-size: 20px; }
  .test-intro p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="index.html">
      <div class="site-logo">✓</div>
      <div>
        <div class="site-title">Внешняя оценка знаний</div>
        <div class="site-subtitle">Тесты по охране труда</div>
      </div>
    </a>
  </div>
</header>

<main class="page">
  <div class="top-nav"><a class="link-back" href="memo.html">← К памятке</a></div>
  <div id="app">
    <div class="test-intro">
      <h1>Проверка по памятке ОЗ.04</h1>
      <p>8 вопросов по первой помощи — займёт минуту</p>
    </div>
    <div class="loading">Загрузка…</div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>Внешняя оценка знаний · тесты по охране труда</span>
    <span>Памятка ОЗ.04 · проверка</span>
    <span>Версия от 03.10.2026</span>
  </div>
</footer>

<script src="common.js"></script>
<script>
// ====== ВОПРОСЫ ПО ПАМЯТКЕ ======
// Составлены по тексту памятки, варианты ответов — из неё же
const QUIZ = [
  {
    q: "За какое время нужно оповестить руководителя или диспетчера при обнаружении пострадавшего?",
    a: ["за 4 минуты", "за 10 минут", "за 30 минут"],
    right: 0,
    why: "Памятка: обеспечить оповещение в течение 4 минут с момента обнаружения пострадавшего."
  },
  {
    q: "Что обязательно сказать при звонке в рамках проверки барьера ОЗ.04?",
    a: ["«Это проверка связи. Подтвердите готовность выезда на объект <название объекта>»",
        "«У нас учебная тревога, никуда не выезжайте»",
        "Ничего говорить не нужно — достаточно позвонить"],
    right: 0,
    why: "Это дословная фраза из памятки для условного происшествия."
  },
  {
    q: "Сколько нажатий на вдохи при закрытом массаже сердца?",
    a: ["30 нажатий на 2 вдоха", "15 нажатий на 1 вдох", "10 нажатий на 5 вдохов"],
    right: 0,
    why: "Памятка: 30 нажатий на 2 вдоха."
  },
  {
    q: "Что из перечисленного относится к признакам ИНСУЛЬТА?",
    a: ["асимметрия лица, нарушение речи, слабость в конечностях",
        "боль в левой лопатке и руке",
        "повышенная потливость и тошнота"],
    right: 0,
    why: "Асимметрия лица (опущение угла рта) и нарушение речи — признаки инсульта."
  },
  {
    q: "Что относится к признакам ИНФАРКТА МИОКАРДА?",
    a: ["боль в области сердца и левой лопатке, чувство страха, потливость",
        "опущение угла рта",
        "резкая потеря зрения"],
    right: 0,
    why: "Боль в сердце и левой лопатке, нехватка воздуха, страх, потливость, тошнота."
  },
  {
    q: "Какое положение нужно придать пострадавшему при этих состояниях?",
    a: ["полу сидячее, успокоить", "строго лежа на спине", "сидя с наклоном вперёд"],
    right: 0,
    why: "Памятка: придать полу сидячее положение — лежа нагрузка на сердце возрастает."
  },
  {
    q: "Можно ли давать пострадавшему лекарственные препараты?",
    a: ["Нет, кроме случая, когда такие симптомы были раньше и лечение назначено врачом",
        "Да, любые обезболивающие",
        "Да, если пострадавший сам просит"],
    right: 0,
    why: "Памятка: не давать лекарственные препараты, кроме случая, когда лечение назначено врачом."
  },
  {
    q: "Когда можно прекратить непрямой массаж сердца?",
    a: ["при появлении признаков жизни или при передаче пострадавшего бригаде скорой помощи",
        "через 5 минут после начала",
        "когда приехал руководитель"],
    right: 0,
    why: "Памятка: прекратить при появлении признаков жизни (дыхания, сознания) либо при передаче бригаде скорой."
  }
];

let index = 0;
let correctCount = 0;
let answered = false;

function progressHtml() {
  let html = '<div class="segments">';
  for (let i = 0; i < QUIZ.length; i++) {
    const cls = i < index ? " done" : (i === index ? " current" : "");
    html += '<span class="segments__item' + cls + '"></span>';
  }
  return html + "</div>";
}

function renderQuestion() {
  const app = document.getElementById("app");
  const item = QUIZ[index];

  if (!item) return renderFinal();

  answered = false;

  let options = "";
  item.a.forEach(function (text, i) {
    options +=
      '<label class="option" data-idx="' + i + '">' +
        '<input type="radio" name="answer" value="' + i + '">' +
        '<span class="option__num">' + (i + 1) + '</span>' +
        '<span class="option__text">' + escapeHtml(text) + '</span>' +
      '</label>';
  });

  app.innerHTML =
    '<div class="q-head">' +
      '<span class="badge-block" style="--block:#dc2626;--block-soft:#fdeaea">' +
        uiIcon("aid", 16) + ' Памятка ОЗ.04</span>' +
      '<span class="q-counter">Вопрос ' + (index + 1) + " / " + QUIZ.length + '</span>' +
    '</div>' +
    progressHtml() +
    '<div class="question">' +
      '<div class="q-type">Один правильный ответ</div>' +
      '<h3>' + escapeHtml(item.q) + '</h3>' +
      '<div id="options">' + options + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="actions" id="nextWrap" style="display:none;">' +
        '<button class="btn btn--block" id="nextBtn">' +
          (index + 1 < QUIZ.length ? "Следующий вопрос →" : "Показать результат") +
        '</button>' +
      '</div>' +
    '</div>';

  app.querySelectorAll("label[data-idx]").forEach(function (label) {
    label.querySelector("input").addEventListener("change", function () {
      choose(parseInt(label.dataset.idx, 10));
    });
  });

  // переход к следующему вопросу (или к итогу, если вопросы кончились)
  document.getElementById("nextBtn").addEventListener("click", function () {
    index++;
    renderQuestion();
  });
}

function choose(chosen) {
  if (answered) return;
  answered = true;

  const item = QUIZ[index];
  const isRight = chosen === item.right;
  if (isRight) correctCount++;

  document.querySelectorAll("label[data-idx]").forEach(function (label) {
    const i = parseInt(label.dataset.idx, 10);
    label.classList.add("disabled");
    label.querySelector("input").disabled = true;
    if (i === item.right) label.classList.add("correct-answer");
    else if (i === chosen) label.classList.add("wrong-answer");
  });

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (isRight ? "ok" : "err");
  fb.innerHTML = isRight
    ? '<b><span class="marks">' + uiIcon("check", 16) + '</span>Верно</b>' +
      '<div style="margin-top:6px;">' + escapeHtml(item.why) + '</div>'
    : '<b><span class="marks">' + uiIcon("cross", 16) + '</span>Неверно</b>' +
      '<div style="margin-top:6px;">' + escapeHtml(item.why) + '</div>';

  document.getElementById("nextWrap").style.display = "block";
}

function renderFinal() {
  const app = document.getElementById("app");
  const percent = Math.round(correctCount / QUIZ.length * 100);
  const tone = percent >= 90 ? "ok" : (percent >= 70 ? "warn" : "err");

  const R = 52;
  const C = 2 * Math.PI * R;

  app.innerHTML =
    '<div class="final">' +
      '<h2>Проверка завершена</h2>' +
      '<div class="final__sub">Памятка ОЗ.04 · первая помощь</div>' +

      '<div class="score score--' + tone + '">' +
        '<svg class="score__ring" viewBox="0 0 120 120" aria-hidden="true">' +
          '<circle class="score__track" cx="60" cy="60" r="' + R + '"></circle>' +
          '<circle class="score__value" cx="60" cy="60" r="' + R + '" ' +
            'stroke-dasharray="' + C.toFixed(1) + '" ' +
            'stroke-dashoffset="' + (C * (1 - percent / 100)).toFixed(1) + '"></circle>' +
        '</svg>' +
        '<div class="score__center">' +
          '<div class="score__percent">' + correctCount + " / " + QUIZ.length + '</div>' +
          '<div class="score__sub">' + percent + '% верных</div>' +
        '</div>' +
      '</div>' +

      '<div class="final__sub">' +
        (percent === 100
          ? "Все ответы верные — памятку вы знаете."
          : "Загляните в памятку и попробуйте ещё раз.") +
      '</div>' +

      '<div class="final-buttons">' +
        '<button class="btn" id="againBtn">Пройти заново</button>' +
        '<a class="btn btn--secondary" href="memo.html">К памятке</a>' +
      '</div>' +
    '</div>';

  document.getElementById("againBtn").addEventListener("click", function () {
    index = 0;
    correctCount = 0;
    renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
