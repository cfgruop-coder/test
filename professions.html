<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты по профессии</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css?v=9">
<script>
  // тема выбирается до первой отрисовки, чтобы страница не мигала
  try {
    var savedTheme = localStorage.getItem("theme.v1");
    // светлая тема по умолчанию; тёмная — только если её выбрал сам пользователь
    document.documentElement.setAttribute("data-theme", savedTheme === "dark" ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="index.html">
      <div class="site-logo">✓</div>
      <div>
        <div class="site-title">SFGroup - тестирование</div>
        <div class="site-subtitle">Тесты по охране труда</div>
      </div>
    </a>
  </div>
</header>

<main class="page page--wide">
  <div class="top-nav"><a class="link-chip" href="index.html"><span class="marks" data-icon="home" data-size="16"></span>На главную</a></div>
  <h1 class="page-title">Тесты по профессии</h1>
  <p class="page-sub">Выберите профессию — тест из 50 вопросов</p>
  <div class="card-list" id="list">
    <div class="skeleton">
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>SFGroup - тестирование · тесты по охране труда</span>
    <span>Версия от 03.10.2026</span>
  </div>
</footer>

<script src="common.js?v=6"></script>
<script>
// карточка профессии: иконка-каска, название и число вопросов
function card(title, meta, iconHtml, href) {
  const a = document.createElement("a");
  a.className = "card-link";
  a.href = href;
  a.innerHTML =
    '<span class="card-link__icon">' + iconHtml + '</span>' +
    '<span class="card-link__body"><span class="card-link__title"></span>' +
      '<span class="card-link__meta"></span></span>' +
    '<span class="card-link__chev">›</span>';
  a.querySelector(".card-link__title").textContent = title;
  a.querySelector(".card-link__meta").textContent = meta;
  return a;
}

async function load() {
  const tests = await fetchJson("tests.json");
  const professions = tests.filter(function (t) {
    return (t.group || "profession") === "profession";
  });

  const box = document.getElementById("list");
  box.innerHTML = "";

  professions.forEach(function (t) {
    const count = (t.parts || []).reduce(function (s, p) { return s + p.count; }, 0);
    box.appendChild(card(
      t.title,
      count + " " + plural(count, "вопрос", "вопроса", "вопросов"),
      workerIcon(PROFESSION_HELMETS[t.id]),
      "test.html?id=" + encodeURIComponent(t.id)
    ));
  });

  fillIcons(box);
}

load().catch(function (e) {
  document.getElementById("list").innerHTML =
    '<div class="error-box">Ошибка: ' + escapeHtml(e.message) + '<br>' +
    'Проверь, что файл <b>tests.json</b> лежит рядом со страницей.</div>';
});
</script>
</body>
</html>
