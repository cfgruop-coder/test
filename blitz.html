  /* ===== таймер ===== */

<script src="common.js"></script>
<script>
// ====== НАСТРОЙКИ БЛИЦА ======
const SINGLE_SECONDS = 15;      // обычный вопрос
const MULTIPLE_SECONDS = 20;    // где несколько ответов
const FEEDBACK_MS = 700;        // сколько показываем верно/неверно

// ====== СОСТОЯНИЕ ======
let tests = null;
let source = null;              // что проходим: блок, профессия или все виды работ
let questionsByTopic = {};
let items = [];
let answers = [];
let index = 0;
let chosenCount = 50;
let startedAt = 0;

let questionSeconds = SINGLE_SECONDS;
let timerId = null;
let deadline = 0;
let remaining = 0;
let paused = false;
let locked = false;             // идёт показ правильного ответа

// ====== ЗАГРУЗКА ======
function loadTopicQuestions(topic) {
  const url = "q-" + topic + ".json";
  return fetch(url, { cache: "no-cache" }).then(function (response) {
    if (!response.ok) {
      throw new Error("Не найден файл блока " + url +
        ". После правки questions.json файлы блоков нужно пересобрать.");
    }
    return response.json();
  });
}

// Список для выбора: по какому блоку или профессии устроить блиц
async function renderPicker(tests) {
  const counts = await fetchJson("counts.json");

  const works = tests.filter(function (t) { return (t.group || "profession") === "work"; });
  const professions = tests.filter(function (t) { return (t.group || "profession") === "profession"; });

  function questionsIn(test) {
    if (test.parts) {
      return test.parts.reduce(function (sum, p) { return sum + p.count; }, 0);
    }
    return counts.counts[test.topic] || 0;
  }

  function card(title, meta, iconHtml, href, info) {
    const a = document.createElement("a");
    a.className = "card-link" + (info ? " card-link--block" : "");
    a.href = href;

    if (info) {
      a.style.setProperty("--block", info.color);
      a.style.setProperty("--block-soft", info.soft);
    }

    a.innerHTML =
      '<span class="card-link__icon">' + iconHtml + '</span>' +
      '<span class="card-link__body"><span class="card-link__title"></span>' +
        '<span class="card-link__meta"></span></span>' +
      '<span class="card-link__chev">\u203a</span>';

    a.querySelector(".card-link__title").textContent = title;
    a.querySelector(".card-link__meta").textContent = meta;
    return a;
  }

  function group(text) {
    const el = document.createElement("div");
    el.className = "blitz-group";
    el.textContent = text;
    return el;
  }

  const app = document.getElementById("app");
  app.innerHTML =
    '<h1 class="page-title">Блиц-опрос</h1>' +
    '<p class="page-sub">Выберите, по чему проверить себя: 15 секунд на вопрос и без подготовки</p>' +
    '<div id="pickWorks"></div><div id="pickProfs"></div>';

  const worksBox = document.getElementById("pickWorks");
  worksBox.appendChild(group("По видам работ"));
  const workList = document.createElement("div");
  workList.className = "card-list";
  works.forEach(function (t) {
    const info = blockInfo(t.topic);
    workList.appendChild(card(t.title, questionsWord(questionsIn(t)), info.icon,
      "blitz.html?block=" + encodeURIComponent(t.id), info));
  });
  worksBox.appendChild(workList);

  const profBox = document.getElementById("pickProfs");
  profBox.appendChild(group("По профессиям"));
  const profList = document.createElement("div");
  profList.className = "card-list";
  professions.forEach(function (t) {
    profList.appendChild(card(t.title, questionsWord(questionsIn(t)),
      workerIcon(PROFESSION_HELMETS[t.id]),
      "blitz.html?prof=" + encodeURIComponent(t.id)));
  });
  profBox.appendChild(profList);

  document.title = "Блиц-опрос";
  fillIcons(app);
}

async function boot() {
  const params = new URLSearchParams(location.search);
  const blockId = params.get("block");
  const profId = params.get("prof");

  try {
    tests = await fetchJson("tests.json");

    if (profId) {
      const test = tests.find(function (t) {
        return t.id === profId && (t.group || "profession") === "profession";
      });
      if (!test) throw new Error("Профессия не найдена: " + profId);
      source = {
        kind: "prof",
        title: test.title,
        topics: test.parts.map(function (p) { return { topic: p.topic, weight: p.count }; })
      };
    } else if (blockId) {
      const test = tests.find(function (t) { return t.id === blockId && t.group === "work"; });
      if (!test) throw new Error("Блок не найден: " + blockId);
      source = { kind: "block", title: test.title, topics: [{ topic: test.topic, weight: 1 }] };
    } else {
      // без параметров показываем список: по чему устроить блиц
      await renderPicker(tests);
      return;
    }

    const topics = source.topics.map(function (t) { return t.topic; });
    const loaded = await Promise.all(topics.map(loadTopicQuestions));
    topics.forEach(function (topic, i) { questionsByTopic[topic] = loaded[i]; });

    const available = topics.reduce(function (sum, topic) {
      return sum + questionsByTopic[topic].length;
    }, 0);
    if (!available) throw new Error("В выбранных блоках нет вопросов");

    document.title = "Блиц: " + source.title;
    renderSetup(available);

  } catch (e) {
    showError(e.message);
  }
}

// ====== ЭКРАН НАСТРОЙКИ ======
function countOptions(available) {
  const options = [20, 50, 100].filter(function (n) { return n < available; });
  options.push(available);
  return options;
}

function renderSetup(available) {
  const app = document.getElementById("app");
  const options = countOptions(available);
  const wanted = parseInt(new URLSearchParams(location.search).get("count"), 10);
  chosenCount = options.indexOf(wanted) >= 0
    ? wanted
    : (options.indexOf(50) >= 0 ? 50 : options[options.length - 1]);

  let topicsHtml = "";
  if (source.kind !== "block") {
    topicsHtml = '<div class="setup__label">Вопросы берутся из блоков:</div><div class="topic-list">';
    source.topics.forEach(function (t) {
      const info = blockInfo(t.topic);
      const pool = questionsByTopic[t.topic].length;
      topicsHtml +=
        '<div class="topic-list__row">' +
          '<span class="topic-list__dot" style="background:' + info.color + '"></span>' +
          escapeHtml(info.title) + " <span style=\'color:var(--muted)\'>· " + questionsWord(pool) + '</span>' +
        '</div>';
    });
    topicsHtml += "</div>";
  }

  app.innerHTML =
    '<div class="setup">' +
      '<h2>' + escapeHtml(source.title) + '</h2>' +
      '<div class="setup__sub">Блиц-опрос · всего доступно ' + questionsWord(available) + '</div>' +

      '<div class="setup__label">Сколько вопросов?</div>' +
      '<div class="chips" id="countChips">' +
        options.map(function (n) {
          return '<button type="button" class="chip' + (n === chosenCount ? " active" : "") +
                 '" data-count="' + n + '">' + (n === available ? "все " + n : n) + '</button>';
        }).join("") +
      '</div>' +

      '<div class="setup__note">' +
        'На обычный вопрос — ' + SINGLE_SECONDS + ' секунд, где несколько ответов — ' +
        MULTIPLE_SECONDS + ' секунд. Время вышло — вопрос засчитывается ошибкой.' +
      '</div>' +

      topicsHtml +

      '<div class="actions">' +
        '<button class="btn btn--block" id="startBtn">Начать блиц</button>' +
      '</div>' +
    '</div>';

  app.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      app.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      chosenCount = parseInt(chip.dataset.count, 10);
    });
  });

  document.getElementById("startBtn").addEventListener("click", function () {
    startBlitz(chosenCount);
  });
}

// ====== НАБОР ВОПРОСОВ ======
// Делим нужное количество между блоками пропорционально их весу
function distribute(count, topics) {
  const totalWeight = topics.reduce(function (s, t) { return s + t.weight; }, 0) || 1;

  const plan = topics.map(function (t) {
    const exact = count * t.weight / totalWeight;
    return { topic: t.topic, base: Math.floor(exact), frac: exact - Math.floor(exact), take: 0 };
  });

  let sum = plan.reduce(function (s, p) { return s + p.base; }, 0);
  plan.slice().sort(function (a, b) { return b.frac - a.frac; }).forEach(function (p) {
    if (sum < count) { p.base++; sum++; }
  });

  plan.forEach(function (p) {
    p.take = Math.min(p.base, questionsByTopic[p.topic].length);
  });

  // если блок упёрся в свой размер — добираем у остальных
  let shortage = count - plan.reduce(function (s, p) { return s + p.take; }, 0);
  while (shortage > 0) {
    let moved = false;
    for (const p of plan) {
      if (shortage <= 0) break;
      if (p.take < questionsByTopic[p.topic].length) { p.take++; shortage--; moved = true; }
    }
    if (!moved) break;
  }

  return plan;
}

function startBlitz(count) {
  const used = {};
  items = [];

  distribute(count, source.topics).forEach(function (p) {
    pickUnique(questionsByTopic[p.topic], p.take, used).forEach(function (q) {
      items.push({
        topic: p.topic,
        question: q.question,
        options: shuffle(q.options),
        type: q.type
      });
    });
  });

  items = shuffle(items);          // блоки идут вперемешку
  answers = [];
  index = 0;
  startedAt = Date.now();
  renderQuestion();
}

// ====== ТАЙМЕР ======
function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
}

function startTimer() {
  stopTimer();
  paused = false;
  deadline = performance.now() + questionSeconds * 1000;
  tick();
  timerId = setInterval(tick, 100);
}

function tick() {
  if (paused || locked) return;

  const left = Math.max(0, deadline - performance.now());
  const secondsLeft = Math.ceil(left / 1000);
  const bar = document.querySelector(".timer");
  const fill = document.getElementById("timerFill");
  const label = document.getElementById("timerSec");

  if (fill) fill.style.width = (left / (questionSeconds * 1000) * 100) + "%";
  if (label) label.textContent = secondsLeft + " сек";
  if (bar) {
    bar.className = "timer" + (secondsLeft <= 3 ? " danger" : (secondsLeft <= 5 ? " warn" : ""));
  }

  if (left <= 0) timeout();
}

// пауза, если человек свернул вкладку
document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    if (timerId && !locked) {
      remaining = Math.max(0, deadline - performance.now());
      paused = true;
    }
  } else if (paused) {
    paused = false;
    deadline = performance.now() + remaining;
  }
});

// ====== ЭКРАН ВОПРОСА ======
function renderQuestion() {
  const app = document.getElementById("app");
  const item = items[index];

  if (!item) return renderFinal();

  const info = blockInfo(item.topic);
  const isMultiple = item.type === "multiple";
  questionSeconds = isMultiple ? MULTIPLE_SECONDS : SINGLE_SECONDS;
  locked = false;

  let optionsHTML = "";
  item.options.forEach(function (opt, j) {
    optionsHTML +=
      '<label class="option" data-idx="' + j + '">' +
        '<input type="' + (isMultiple ? "checkbox" : "radio") + '" name="answer" value="' + j + '">' +
        '<span class="option__num">' + (j + 1) + '</span>' +
        '<span class="option__text">' + escapeHtml(opt.text) + '</span>' +
      '</label>';
  });

  app.innerHTML =
    '<div class="q-head">' +
      '<span class="badge-block" style="--block:' + info.color + ';--block-soft:' + info.soft + '">' +
        info.icon + " " + escapeHtml(info.title) +
      '</span>' +
      '<span class="q-counter">' + (index + 1) + " / " + items.length + '</span>' +
    '</div>' +

    '<div class="timer">' +
      '<div class="timer__bar"><div class="timer__fill" id="timerFill"></div></div>' +
      '<div class="timer__sec" id="timerSec">' + questionSeconds + ' сек</div>' +
    '</div>' +

    '<div class="question">' +
      '<div class="q-type">' + (isMultiple ? "Несколько ответов" : "Один ответ") + '</div>' +
      '<h3>' + escapeHtml(item.question) + '</h3>' +
      '<div id="options">' + optionsHTML + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="actions" id="doneWrap" style="display:none;">' +
        '<button class="btn btn--block" id="doneBtn">Готово</button>' +
      '</div>' +
    '</div>';

  const labels = app.querySelectorAll("label[data-idx]");
  labels.forEach(function (label) {
    const input = label.querySelector("input");
    input.addEventListener("change", function () {
      if (isMultiple) {
        label.classList.toggle("selected", input.checked);
        const anyChecked = Array.from(document.querySelectorAll('input[name="answer"]'))
          .some(function (i) { return i.checked; });
        document.getElementById("doneWrap").style.display = anyChecked ? "block" : "none";
      } else {
        label.classList.add("selected");
        answer([parseInt(label.dataset.idx, 10)]);
      }
    });
  });

  if (isMultiple) {
    document.getElementById("doneBtn").addEventListener("click", function () {
      const selected = Array.from(document.querySelectorAll('input[name="answer"]:checked'))
        .map(function (i) { return parseInt(i.value, 10); });
      if (selected.length) answer(selected);
    });
  }

  startTimer();
}

// ====== ПРОВЕРКА ======
function correctIndexes(item) {
  return item.options
    .map(function (o, i) { return o.correct ? i : -1; })
    .filter(function (i) { return i >= 0; });
}

function rightAnswersHtml(options, correctIdx) {
  let html = '<div style="margin-top:8px;">';
  correctIdx.forEach(function (i) {
    html += '<div class="fb-row fb-row--ok">' + escapeHtml(options[i].text) + '</div>';
  });
  return html + "</div>";
}

function paintResult(selected, correctIdx) {
  document.querySelectorAll("label[data-idx]").forEach(function (label) {
    const idx = parseInt(label.dataset.idx, 10);
    label.classList.add("disabled");
    label.querySelector("input").disabled = true;

    const wasSelected = selected.indexOf(idx) >= 0;
    const isRight = correctIdx.indexOf(idx) >= 0;

    if (isRight && wasSelected) label.classList.add("correct-answer");
    else if (isRight) label.classList.add("missed-answer");
    else if (wasSelected) label.classList.add("wrong-answer");
  });
}

function scheduleNext() {
  stopTimer();
  setTimeout(function () { index++; renderQuestion(); }, FEEDBACK_MS);
}

function answer(selected) {
  if (locked) return;
  locked = true;

  const item = items[index];
  const correctIdx = correctIndexes(item);
  const isCorrect = selected.length === correctIdx.length &&
    selected.every(function (s) { return correctIdx.indexOf(s) >= 0; });

  paintResult(selected, correctIdx);

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (isCorrect ? "ok" : "err");
  fb.innerHTML = isCorrect ? "<b>Верно</b>" : "<b>Неверно</b>" + rightAnswersHtml(item.options, correctIdx);

  const done = document.getElementById("doneWrap");
  if (done) done.style.display = "none";

  answers.push({
    item: item,
    correct: isCorrect,
    timedOut: false,
    selectedTexts: selected.map(function (i) { return item.options[i].text; }),
    correctTexts: correctIdx.map(function (i) { return item.options[i].text; })
  });

  scheduleNext();
}

function timeout() {
  if (locked) return;
  locked = true;

  const item = items[index];
  const correctIdx = correctIndexes(item);

  paintResult([], correctIdx);

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback err";
  fb.innerHTML = "<b>Время вышло</b>" + rightAnswersHtml(item.options, correctIdx);

  const done = document.getElementById("doneWrap");
  if (done) done.style.display = "none";

  answers.push({
    item: item,
    correct: false,
    timedOut: true,
    selectedTexts: [],
    correctTexts: correctIdx.map(function (i) { return item.options[i].text; })
  });

  scheduleNext();
}

// ====== ФИНАЛ ======
function formatDuration(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m ? m + " мин " + s + " с" : s + " с";
}

function renderFinal() {
  stopTimer();
  const app = document.getElementById("app");

  const total = items.length;
  const correct = answers.filter(function (a) { return a.correct; }).length;
  const percent = total ? Math.round(correct / total * 100) : 0;
  const spent = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
  const tone = percent >= 90 ? "ok" : (percent >= 70 ? "warn" : "err");

  const R = 52;
  const C = 2 * Math.PI * R;
  const ring =
    '<div class="score score--' + tone + '">' +
      '<svg class="score__ring" viewBox="0 0 120 120" aria-hidden="true">' +
        '<circle class="score__track" cx="60" cy="60" r="' + R + '"></circle>' +
        '<circle class="score__value" cx="60" cy="60" r="' + R + '" ' +
          'stroke-dasharray="' + C.toFixed(1) + '" ' +
          'stroke-dashoffset="' + (C * (1 - percent / 100)).toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="score__center">' +
        '<div class="score__percent">' + percent + '%</div>' +
        '<div class="score__sub">' + correct + " из " + total + '</div>' +
      '</div>' +
    '</div>';

  // разбивка по блокам
  const byTopic = {};
  answers.forEach(function (a) {
    const topic = a.item.topic;
    byTopic[topic] = byTopic[topic] || { correct: 0, total: 0 };
    byTopic[topic].total++;
    if (a.correct) byTopic[topic].correct++;
  });

  let rows = "";
  source.topics.forEach(function (t) {
    const st = byTopic[t.topic];
    if (!st) return;
    const info = blockInfo(t.topic);
    const p = Math.round(st.correct / st.total * 100);
    rows += '<tr>' +
      '<td><span class="dot" style="background:' + info.color + '"></span>' + escapeHtml(info.title) + '</td>' +
      '<td class="num">' + st.correct + " / " + st.total + '</td>' +
      '<td class="num">' + p + '%</td>' +
    '</tr>';
  });

  // разбор ошибок
  const mistakes = answers.filter(function (a) { return !a.correct; });
  let mistakesHtml = "";
  if (mistakes.length) {
    mistakesHtml = '<details class="mistakes"><summary>' +
      "Ошибки: " + mistakes.length + " из " + total + " — показать разбор" + '</summary>';
    mistakes.forEach(function (m) {
      mistakesHtml +=
        '<div class="mistake">' +
          '<div class="mistake__q">' + escapeHtml(m.item.question) + '</div>' +
          '<div class="mistake__row mistake__row--bad">' +
            '<span class="mistake__label">Ваш ответ:</span> ' +
            (m.selectedTexts.length ? escapeHtml(m.selectedTexts.join("; "))
                                    : (m.timedOut ? "время вышло" : "нет ответа")) +
          '</div>' +
          '<div class="mistake__row mistake__row--good">' +
            '<span class="mistake__label">Правильно:</span> ' + escapeHtml(m.correctTexts.join("; ")) +
          '</div>' +
        '</div>';
    });
    mistakesHtml += "</details>";
  }

  app.innerHTML =
    '<div class="final">' +
      '<h2>Блиц завершён</h2>' +
      '<div class="final__sub">' + escapeHtml(source.title) + '</div>' +

      ring +

      '<div class="final__sub">Время: ' + formatDuration(spent) +
        ' · в среднем ' + Math.round(spent / total) + ' с на вопрос</div>' +

      '<table class="topic-results">' +
        '<thead><tr><th>Блок</th><th>Результат</th><th>Процент</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +

      mistakesHtml +

      '<div class="final-buttons">' +
        '<button class="btn" id="againBtn">Пройти ещё раз</button>' +
        '<button class="btn btn--secondary" id="homeBtn"><span class="marks">' + uiIcon("home", 17) + '</span>На главную</button>' +
      '</div>' +
    '</div>';

  document.getElementById("againBtn").addEventListener("click", function () {
    startBlitz(items.length);
  });
  document.getElementById("homeBtn").addEventListener("click", function () {
    window.location.href = "index.html";
  });
}

// ====== ОШИБКА ======
function showError(msg) {
  document.getElementById("app").innerHTML =
    '<div class="error">' +
      '<h2>Не получилось</h2>' +
      '<p>' + escapeHtml(msg) + '</p>' +
      '<p><a class="link-chip" href="index.html"><span class="marks">' + uiIcon("home", 16) + '</span>На главную</a></p>' +
    '</div>';
}

boot();
</script>
</body>
</html>
