<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 860px; margin: 0 auto; padding: 20px;
    background: #f0f2f5; color: #1a1a1a; line-height: 1.5;
  }
  h1 { text-align: center; color: #0066cc; margin-bottom: 5px; font-size: 24px; }
  .topic-label { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
  .progress-bar {
    height: 8px; background: #e0e0e0; border-radius: 4px;
    margin-bottom: 20px; overflow: hidden;
  }
  .progress-bar__fill {
    height: 100%; background: #0066cc; width: 0%;
    transition: width 0.3s;
  }
  .question {
    background: #fff; padding: 22px; margin-bottom: 15px;
    border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .badge {
    display: inline-block; font-size: 12px; padding: 3px 10px;
    border-radius: 10px; background: #eef4ff; color: #0066cc;
    margin-bottom: 12px; font-weight: 500;
  }
  .question h3 { margin: 0 0 16px; font-size: 17px; font-weight: 600; }
  label {
    display: block; padding: 13px 16px; margin: 8px 0;
    cursor: pointer; border-radius: 8px; border: 2px solid #e0e0e0;
    transition: all 0.15s; font-size: 15px;
  }
  label:hover { background: #f5f8ff; border-color: #b8d0f0; }
  label.selected { background: #eef4ff; border-color: #0066cc; }
  label.disabled { cursor: default; }
  label.correct-answer { background: #e8f5e9; border-color: #4caf50; }
  label.wrong-answer { background: #ffebee; border-color: #f44336; }
  input[type="checkbox"], input[type="radio"] { margin-right: 10px; }
  button {
    display: inline-block; padding: 14px 24px; font-size: 16px;
    background: #0066cc; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600; transition: background 0.15s;
  }
  button:hover { background: #0055aa; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .feedback {
    margin-top: 16px; padding: 14px 16px; border-radius: 8px;
    font-size: 15px; display: none;
  }
  .feedback.ok { background: #e8f5e9; color: #1b5e20; border-left: 4px solid #4caf50; }
  .feedback.err { background: #ffebee; color: #b71c1c; border-left: 4px solid #f44336; }
  .feedback b { font-weight: 600; }
  .next-btn-wrap { text-align: right; margin-top: 12px; }
  .final {
    background: #fff; padding: 30px; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    text-align: center;
  }
  .final h2 { margin-top: 0; }
  .final .overall { font-size: 18px; margin: 20px 0; color: #555; }
  .topic-results {
    text-align: left; margin: 20px 0; border-collapse: collapse;
    width: 100%; font-size: 15px;
  }
  .topic-results th, .topic-results td {
    padding: 10px 12px; border-bottom: 1px solid #eee;
    text-align: left;
  }
  .topic-results th { color: #666; font-weight: 600; font-size: 13px; text-transform: uppercase; }
  .topic-results .ok { color: #1b5e20; font-weight: 600; }
  .topic-results .fail { color: #b71c1c; font-weight: 600; }
  .final-buttons {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 24px; flex-wrap: wrap;
  }
  .final-buttons button { min-width: 180px; }
  .btn-secondary { background: #666; }
  .btn-secondary:hover { background: #444; }
  .top-nav { margin-bottom: 14px; }
  .top-nav a { color: #666; text-decoration: none; font-size: 14px; }
  .top-nav a:hover { color: #0066cc; text-decoration: underline; }
  .loading, .error {
    text-align: center; padding: 40px; color: #666;
  }
  .error { color: #c62828; }
</style>
</head>
<body>

<div class="top-nav"><a href="index.html">← На главную</a></div>

<div id="app">
  <div class="loading">⏳ Загрузка теста...</div>
</div>

<script src="common.js"></script>
<script>
// ====== ВСПОМОГАТЕЛЬНОЕ ======
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

// ====== СОСТОЯНИЕ ======
let test = null;
let allQuestions = null;
let items = [];
let currentIndex = 0;
let topicStats = {};
let activeParts = [];     // что проходим: билет блока или тест целиком
let displayTitle = "";    // заголовок страницы (с номером билета)
let currentTicket = 0;    // номер билета (0 — тест по профессии)

// Названия тем (TOPIC_NAMES) лежат в common.js

// ====== ЗАГРУЗКА ======
async function start() {
  const id = getParam("id");
  if (!id) return showError("Не указан тест. Вернись на главную.");

  try {
    const [tests, loadedQuestions] = await Promise.all([
      fetchJson("tests.json"),
      fetchJson("questions.json")
    ]);

    allQuestions = loadedQuestions;

    test = tests.find(t => t.id === id);
    if (!test) return showError("Тест не найден: " + id);

    const ticketNumber = parseInt(getParam("ticket"), 10);

    // тест по виду работ открывается только через выбор билета
    if (test.group === "work" && !ticketNumber) {
      window.location.replace("block.html?id=" + encodeURIComponent(test.id));
      return;
    }

    currentTicket = ticketNumber || 0;
    activeParts = buildParts(test, allQuestions, ticketNumber);
    displayTitle = ticketNumber ? test.title + " — билет " + ticketNumber : test.title;

    buildTest();
    renderQuestion();
  } catch (e) {
    const back = test && test.group === "work"
      ? "block.html?id=" + encodeURIComponent(id)
      : null;
    showError(e.message, back);
  }
}

// Что проходим: билет блока (по видам работ) или части теста по профессии
function buildParts(t, all, ticketNumber) {
  if (t.group !== "work") return t.parts;

  const pool = all[t.topic] || [];
  const ticket = splitIntoTickets(pool.length, t.ticketSize)[ticketNumber - 1];
  if (!ticket) throw new Error("Билет " + ticketNumber + " не найден");

  return [{ topic: t.topic, offset: ticket.offset, count: ticket.count }];
}

// ====== СБОРКА ТЕСТА ======
function buildTest() {
  items = [];
  topicStats = {};

  for (const part of activeParts) {
    const pool = allQuestions[part.topic] || [];
    if (pool.length === 0) {
      console.warn("Нет вопросов для темы:", part.topic);
      continue;
    }

    // билет — свой кусок блока по порядку файла; тест по профессии — случайная выборка
    const picked = (part.offset !== undefined)
      ? pool.slice(part.offset, part.offset + part.count)
      : shuffle(pool).slice(0, part.count);

    picked.forEach(q => {
      items.push({
        topic: part.topic,
        question: q.question,
        options: shuffle(q.options),
        type: q.type
      });
    });

    topicStats[part.topic] = {
      correct: 0,
      total: picked.length,
      passPercent: typeof part.passPercent === "number" ? part.passPercent : null
    };
  }
}

// ====== ОТРИСОВКА ВОПРОСА ======
function renderQuestion() {
  const app = document.getElementById("app");
  const item = items[currentIndex];

  if (!item) return renderFinal();

  const topicName = TOPIC_NAMES[item.topic] || item.topic;
  const isMultiple = item.type === "multiple";
  const inputType = isMultiple ? "checkbox" : "radio";

  let optionsHTML = "";
  item.options.forEach((opt, j) => {
    optionsHTML += `
      <label data-idx="${j}">
        <input type="${inputType}" name="answer" value="${j}">
        ${opt.text}
      </label>
    `;
  });

  app.innerHTML = `
    <h1>${displayTitle}</h1>
    <div class="topic-label">Тема: ${topicName} · Вопрос ${currentIndex + 1} из ${items.length}</div>
    <div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div>

    <div class="question">
      <span class="badge">${isMultiple ? "Несколько ответов" : "Один ответ"}</span>
      <h3>${item.question}</h3>
      <div id="options">${optionsHTML}</div>

      <div style="margin-top:16px;">
        <button id="checkBtn" disabled>Ответить</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="next-btn-wrap" id="nextWrap" style="display:none;">
        <button id="nextBtn">Следующий вопрос →</button>
      </div>
    </div>
  `;

  // Обработчики выбора
  const labels = app.querySelectorAll("label[data-idx]");
  labels.forEach(label => {
    const input = label.querySelector("input");
    input.addEventListener("change", () => {
      if (isMultiple) {
        label.classList.toggle("selected", input.checked);
      } else {
        labels.forEach(l => l.classList.remove("selected"));
        label.classList.add("selected");
      }
      updateCheckBtn();
    });
  });

  // Кнопки
  document.getElementById("checkBtn").addEventListener("click", checkAnswer);
  document.getElementById("nextBtn").addEventListener("click", nextQuestion);

  updateCheckBtn();
  renderProgress();
}

// ====== АКТИВНОСТЬ КНОПКИ «ОТВЕТИТЬ» ======
function updateCheckBtn() {
  const selected = document.querySelectorAll('input[name="answer"]:checked');
  const btn = document.getElementById("checkBtn");
  if (btn) btn.disabled = selected.length === 0;
}

// ====== ПРОВЕРКА ОТВЕТА ======
function checkAnswer() {
  const item = items[currentIndex];
  const isMultiple = item.type === "multiple";

  const inputs = Array.from(document.querySelectorAll('input[name="answer"]'));
  const selected = inputs.filter(i => i.checked).map(i => parseInt(i.value));

  const correctIdx = item.options
    .map((o, idx) => o.correct ? idx : -1)
    .filter(i => i >= 0);

  const isCorrect =
    selected.length === correctIdx.length &&
    selected.every(s => correctIdx.includes(s));

  // Подсветка вариантов прямо в вопросе
  const labels = document.querySelectorAll("label[data-idx]");
  labels.forEach(label => {
    const idx = parseInt(label.dataset.idx);
    label.classList.add("disabled");
    label.querySelector("input").disabled = true;

    const wasSelected = selected.includes(idx);
    const isRight = correctIdx.includes(idx);

    if (isRight) {
      label.classList.add("correct-answer");
    } else if (wasSelected) {
      label.classList.add("wrong-answer");
    }
  });

  // Фидбек с построчным разбором
  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (isCorrect ? "ok" : "err");

  if (isCorrect) {
    fb.innerHTML = `<b>✅ Правильно!</b>`;
  } else {
    let listHTML = '<div style="margin-top:8px;">';

    item.options.forEach((opt, idx) => {
      const wasSelected = selected.includes(idx);
      const isRight = correctIdx.includes(idx);

      if (isRight && wasSelected) {
        listHTML += `<div style="padding:6px 0; color:#1b5e20;">
          <b>✅</b> ${opt.text}
        </div>`;
      } else if (isRight && !wasSelected) {
        listHTML += `<div style="padding:6px 0; color:#1565c0;">
          <b>➕</b> ${opt.text} <i style="color:#666;">(пропущен правильный ответ)</i>
        </div>`;
      } else if (!isRight && wasSelected) {
        listHTML += `<div style="padding:6px 0; color:#b71c1c; text-decoration:line-through;">
          <b>❌</b> ${opt.text}
        </div>`;
      }
    });

    listHTML += '</div>';
    fb.innerHTML = `<b>❌ Неправильно.</b>${listHTML}`;
  }

  // Скрываем кнопку «Ответить», показываем «Следующий»
  const checkBtn = document.getElementById("checkBtn");
  if (checkBtn) checkBtn.style.display = "none";

  const nextWrap = document.getElementById("nextWrap");
  if (nextWrap) nextWrap.style.display = "block";

  // Статистика
  if (isCorrect) topicStats[item.topic].correct++;
}

// ====== СЛЕДУЮЩИЙ ВОПРОС ======
function nextQuestion() {
  currentIndex++;
  renderQuestion();
}

// ====== ПРОГРЕСС ======
function renderProgress() {
  const fill = document.getElementById("progressFill");
  if (!fill) return;
  const p = (currentIndex / items.length) * 100;
  fill.style.width = p + "%";
}

// ====== ФИНАЛ ======
function renderFinal() {
  const app = document.getElementById("app");

  // Порог есть не у всех: у билетов по видам работ его нет
  const hasThresholds = activeParts.every(part => {
    const st = topicStats[part.topic];
    return !st || typeof st.passPercent === "number";
  });

  let allPassed = true;
  let correctTotal = 0;
  let questionsTotal = 0;
  let rows = "";

  for (const part of activeParts) {
    const st = topicStats[part.topic];
    if (!st) continue;

    correctTotal += st.correct;
    questionsTotal += st.total;
    const percent = st.total ? Math.round(st.correct / st.total * 100) : 0;

    if (hasThresholds) {
      const ok = percent >= st.passPercent;
      if (!ok) allPassed = false;
      rows += `<tr>
        <td>${TOPIC_NAMES[part.topic] || part.topic}</td>
        <td>${st.correct} / ${st.total}</td>
        <td>${percent}%</td>
        <td>порог ${st.passPercent}%</td>
        <td class="${ok ? 'ok' : 'fail'}">${ok ? '✅' : '❌'}</td>
      </tr>`;
    } else {
      rows += `<tr>
        <td>${TOPIC_NAMES[part.topic] || part.topic}</td>
        <td>${st.correct} / ${st.total}</td>
        <td>${percent}%</td>
      </tr>`;
    }
  }

  const overallPercent = questionsTotal ? Math.round(correctTotal / questionsTotal * 100) : 0;
  const passed100 = !hasThresholds && questionsTotal > 0 && correctTotal === questionsTotal;

  // Запоминаем результат билета — по нему список билетов подсвечивает пройденные
  if (test && test.group === "work" && currentTicket) {
    saveTicketResult(test.id, currentTicket, correctTotal, questionsTotal);
  }

  const heading = hasThresholds
    ? (allPassed ? '✅ Тест пройден!' : '❌ Тест не пройден')
    : (passed100 ? '✅ Билет пройден на 100%' : '✅ Тест завершён');

  const overall = hasThresholds
    ? (allPassed
        ? 'Вы набрали нужный процент по всем темам.'
        : 'К сожалению, по одной или нескольким темам порог не взят.')
    : `Правильных ответов: ${correctTotal} из ${questionsTotal} (${overallPercent}%)`
      + (passed100 ? '<br>Билет отмечен зелёным в списке билетов.' : '');

  const headRow = hasThresholds
    ? `<tr><th>Тема</th><th>Результат</th><th>Процент</th><th>Порог</th><th></th></tr>`
    : `<tr><th>Тема</th><th>Результат</th><th>Процент</th></tr>`;

  const isWork = !!(test && test.group === "work");

  app.innerHTML = `
    <div class="final">
      <h2>${heading}</h2>
      <div class="overall">${overall}</div>

      <table class="topic-results">
        <thead>${headRow}</thead>
        <tbody>${rows}</tbody>
      </table>

      <div class="final-buttons">
        <button id="restartBtn">🔄 Пройти заново</button>
        ${isWork ? '<button class="btn-secondary" id="ticketsBtn">📋 Выбрать другой билет</button>' : ''}
        <button class="btn-secondary" id="homeBtn">🏠 На главную</button>
      </div>
    </div>
  `;

  document.getElementById("restartBtn").addEventListener("click", restartTest);
  if (isWork) {
    document.getElementById("ticketsBtn").addEventListener("click", goTickets);
  }
  document.getElementById("homeBtn").addEventListener("click", goMain);
}

function restartTest() {
  currentIndex = 0;
  buildTest();
  renderQuestion();
}

// К списку билетов блока
function goTickets() {
  window.location.href = "block.html?id=" + encodeURIComponent(test.id);
}

// На главную страницу
function goMain() {
  window.location.href = "index.html";
}

// ====== ОШИБКА ======
function showError(msg, backHref) {
  const href = backHref || "index.html";
  const label = backHref ? "Вернуться к выбору билета" : "Вернуться на главную";
  document.getElementById("app").innerHTML = `
    <div class="error">
      <h2>❌ Ошибка</h2>
      <p>${msg}</p>
      <p><a href="${href}">${label}</a></p>
    </div>
  `;
}

// ====== СТАРТ ======
start();
</script>
</body>
</html>
