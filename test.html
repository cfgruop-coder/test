<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css?v=3">
<script>
  // тема выбирается до первой отрисовки, чтобы страница не мигала
  try {
    var savedTheme = localStorage.getItem("theme.v1");
    if (!savedTheme) {
      savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) {}
</script>
<style>

  /* ===== шапка вопроса ===== */
  .q-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge-block {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    background: var(--block-soft, var(--accent-soft));
    color: var(--block, var(--accent));
  }
  .q-counter {
    margin-left: auto; font-size: 13.5px; font-weight: 600;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* ===== прогресс ===== */
  .segments { display: flex; gap: 4px; margin: 12px 0 18px; }
  .segments__item { flex: 1 1 0; height: 6px; border-radius: 3px; background: #e3e8ef; }
  .segments__item.done { background: var(--accent); }
  .segments__item.current { background: var(--accent); opacity: .45; }

  /* ===== вопрос ===== */
  .question {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-2);
    animation: q-in .22s ease both;
  }
  @keyframes q-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .q-type {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-bottom: 8px;
  }
  .question h3 { margin: 0 0 16px; font-size: 17.5px; font-weight: 600; line-height: 1.5; }

  .option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; margin: 8px 0;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: #fff; cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .option:not(.disabled):hover { border-color: #c7d6ee; background: var(--accent-soft); }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.disabled { cursor: default; }
  .option input {
    margin: 3px 0 0; flex: 0 0 auto;
    width: 18px; height: 18px; accent-color: var(--accent);
  }
  .option__text { font-size: 15.5px; }

  .option.correct-answer { border-color: var(--ok); background: var(--ok-soft); box-shadow: inset 4px 0 0 var(--ok); }
  .option.wrong-answer { border-color: var(--err); background: var(--err-soft); box-shadow: inset 4px 0 0 var(--err); }
  .option.missed-answer { border-color: var(--accent); background: #fff; box-shadow: inset 4px 0 0 var(--accent); }
  /* отметки в вариантах — простые символы вместо цветных эмодзи (см. common.css) */

  /* ===== отклик ===== */
  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-sm); font-size: 15px; display: none; }
  .feedback.ok { background: var(--ok-soft); color: #14653c; border-left: 4px solid var(--ok); }
  .feedback.err { background: var(--err-soft); color: #992b2b; border-left: 4px solid var(--err); }
  .fb-row { padding: 4px 0; }
  .fb-row--ok { color: #14653c; }
  .fb-row--plus { color: var(--accent); }
  .fb-row--bad { color: #992b2b; text-decoration: line-through; }

  .actions { margin-top: 18px; }
  .actions + .actions { margin-top: 10px; }

  /* ===== результат ===== */
  .final {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow-2);
  }
  .final h2 { margin: 0 0 6px; font-size: 21px; text-align: center; }
  .final__sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  .score { position: relative; width: 150px; height: 150px; margin: 6px auto 20px; }
  .score__ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score__track { fill: none; stroke: #e3e8ef; stroke-width: 10; }
  .score__value { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .score--ok .score__value { stroke: var(--ok); }
  .score--warn .score__value { stroke: var(--warn); }
  .score--err .score__value { stroke: var(--err); }
  .score__center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score__percent { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .score__sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .topic-results { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-top: 6px; }
  .topic-results th, .topic-results td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .topic-results th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .topic-results .num { font-variant-numeric: tabular-nums; }
  .topic-results .ok { color: #14653c; font-weight: 600; }
  .topic-results .fail { color: #992b2b; font-weight: 600; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }

  .mistakes { margin-top: 24px; }
  .mistakes__title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .mistake {
    border: 1px solid var(--border); border-left: 4px solid var(--err);
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; background: #fff;
  }
  .mistake__q { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .mistake__row { font-size: 14px; margin-top: 4px; }
  .mistake__row--bad { color: #992b2b; }
  .mistake__row--good { color: #14653c; }
  .mistake__label { color: var(--muted); }

  .final-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .final-buttons .btn { min-width: 170px; }

  .error { background: var(--surface); border: 1.5px solid #f4c7c7; border-radius: var(--radius); padding: 26px; text-align: center; }
  .error h2 { color: var(--err); margin-top: 0; }

  @media (max-width: 560px) {
    .final-buttons .btn { min-width: 100%; }
    .topic-results thead { display: none; }
    .topic-results tr { display: block; border-bottom: 1px solid var(--border); padding: 8px 0; }
    .topic-results td { display: inline-block; border: 0; padding: 2px 8px 2px 0; }
  }

  @media print {
    .site-header, .site-footer, .top-nav, .final-buttons, .actions, .feedback { display: none !important; }
    body { background: #fff; }
    .page { padding: 0; max-width: none; }
    .final { box-shadow: none; border-color: #d5d5d5; padding: 0; }
    .mistake { break-inside: avoid; }
    .score { width: 120px; height: 120px; }
  }
</style>

<script>
  // Начинаем грузить вопросы нужного блока ещё до отрисовки страницы:
  // id вида "work-rv" -> файл q-rv.json. Так первый вопрос появляется быстрее.
  (function () {
    try {
      const id = new URLSearchParams(location.search).get("id") || "";
      if (id.indexOf("work-") === 0) {
        const topic = id.slice(5);
        window.__blockPrefetchTopic = topic;
        window.__blockPrefetch = fetch("q-" + topic + ".json", { cache: "no-cache" });
      }
    } catch (e) {
      // не получилось — загрузим обычным путём
    }
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="index.html">
      <div class="site-logo">✓</div>
      <div>
        <div class="site-title">Внешняя оценка знаний</div>
        <div class="site-subtitle">Тесты по охране труда</div>
      </div>
    </a>
  </div>
</header>

<main class="page page--wide">
  <div class="top-nav">
    <a class="link-chip" id="homeLink" href="index.html"><span class="marks" data-icon="home" data-size="16"></span>На главную</a>
  </div>
  <div id="app">
    <div class="loading">Загрузка теста…</div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>Внешняя оценка знаний · тесты по охране труда</span>
    <span>Версия от 03.10.2026</span>
  </div>
</footer>

<script src="common.js"></script>
<script>
// ====== ВСПОМОГАТЕЛЬНОЕ ======
// shuffle и questionKey лежат в common.js
function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

// ====== СОСТОЯНИЕ ======
let test = null;
let allQuestions = null;
let items = [];
let currentIndex = 0;
let topicStats = {};
let activeParts = [];     // что проходим: билет блока или тест целиком
let displayTitle = "";    // заголовок страницы (с номером билета)
let currentTicket = 0;    // номер билета (0 — тест по профессии)
let answers = [];         // ответы пользователя (для сводки ошибок)
let finished = false;     // тест доведён до конца
let usedQuestionKeys = {};// формулировки, уже попавшие в этот тест

// Названия и цвета блоков (BLOCKS, TOPIC_NAMES) лежат в common.js

// ====== ЗАГРУЗКА ======
async function start() {
  const id = getParam("id");
  if (!id) return showError("Не указан тест. Вернись на главную.");

  try {
    const tests = await fetchJson("tests.json");

    test = tests.find(function (t) { return t.id === id; });
    if (!test) return showError("Тест не найден: " + id);

    const ticketNumber = parseInt(getParam("ticket"), 10);

    // тест по виду работ открывается только через выбор билета
    if (test.group === "work" && !ticketNumber) {
      window.location.replace("block.html?id=" + encodeURIComponent(test.id));
      return;
    }

    // грузим только те блоки, которые нужны этому тесту
    const topics = neededTopics(test);
    const arrays = await Promise.all(topics.map(loadBlockArray));
    allQuestions = {};
    topics.forEach(function (topic, index) { allQuestions[topic] = arrays[index]; });

    currentTicket = ticketNumber || 0;
    activeParts = buildParts(test, allQuestions, ticketNumber);
    displayTitle = ticketNumber ? test.title + " — билет " + ticketNumber : test.title;
    document.title = displayTitle;

    // запоминаем, что открывали: на главной появится кнопка «Продолжить»
    saveLastVisit(
      "test.html?id=" + encodeURIComponent(test.id) +
        (ticketNumber ? "&ticket=" + ticketNumber : ""),
      ticketNumber ? "Билет " + ticketNumber + " · " + test.title : test.title
    );

    buildTest();
    renderQuestion();
  } catch (e) {
    const back = test && test.group === "work"
      ? "block.html?id=" + encodeURIComponent(id)
      : null;
    showError(e.message, back);
  }
}

// Какие блоки нужны для этого теста
function neededTopics(t) {
  if (t.group === "work") return [t.topic];

  const topics = [];
  t.parts.forEach(function (part) {
    if (topics.indexOf(part.topic) < 0) topics.push(part.topic);
  });
  return topics;
}

// Загрузка вопросов одного блока (подхватывает раннюю загрузку из <head>)
function loadBlockArray(topic) {
  const url = "q-" + topic + ".json";
  const early = (window.__blockPrefetchTopic === topic) ? window.__blockPrefetch : null;

  const request = early
    ? early.catch(function () { return fetch(url, { cache: "no-cache" }); })
    : fetch(url, { cache: "no-cache" });

  return request.then(function (response) {
    if (!response.ok) {
      throw new Error("Не найден файл блока " + url +
        ". После правки questions.json файлы блоков нужно пересобрать.");
    }
    return response.json();
  });
}

// Что проходим: билет блока (по видам работ) или части теста по профессии
function buildParts(t, all, ticketNumber) {
  if (t.group !== "work") return t.parts;

  const pool = all[t.topic] || [];
  const ticket = splitIntoTickets(pool.length, t.ticketSize)[ticketNumber - 1];
  if (!ticket) throw new Error("Билет " + ticketNumber + " не найден");

  return [{ topic: t.topic, offset: ticket.offset, count: ticket.count }];
}

// ====== СБОРКА ТЕСТА ======
// выборка без повторов формулировок (pickUnique) лежит в common.js

function buildTest() {
  items = [];
  answers = [];
  topicStats = {};
  finished = false;
  usedQuestionKeys = {};

  for (const part of activeParts) {
    const pool = allQuestions[part.topic] || [];
    if (pool.length === 0) {
      console.warn("Нет вопросов для темы:", part.topic);
      continue;
    }

    // билет — свой кусок блока по порядку файла; тест по профессии — случайная выборка
    const picked = (part.offset !== undefined)
      ? pool.slice(part.offset, part.offset + part.count)
      : pickUnique(pool, part.count, usedQuestionKeys);

    picked.forEach(function (q) {
      items.push({
        topic: part.topic,
        question: q.question,
        options: shuffle(q.options),
        type: q.type
      });
    });

    topicStats[part.topic] = {
      correct: 0,
      total: picked.length,
      passPercent: typeof part.passPercent === "number" ? part.passPercent : null
    };
  }
}

// ====== ПРОГРЕСС ======
function progressHtml(total, current) {
  // на длинных тестах (тесты по профессии) — обычная полоса, на билетах — деления
  if (total > 40) {
    const percent = Math.round(current / total * 100);
    return '<div class="bar" style="margin:12px 0 18px;">' +
      '<div class="bar__fill" style="width:' + percent + '%"></div></div>';
  }

  let html = '<div class="segments">';
  for (let i = 0; i < total; i++) {
    const cls = i < current ? " done" : (i === current ? " current" : "");
    html += '<span class="segments__item' + cls + '"></span>';
  }
  return html + "</div>";
}

// ====== ОТРИСОВКА ВОПРОСА ======
function renderQuestion() {
  const app = document.getElementById("app");
  const item = items[currentIndex];

  if (!item) return renderFinal();

  const info = blockInfo(item.topic);
  const isMultiple = item.type === "multiple";
  const inputType = isMultiple ? "checkbox" : "radio";
  const isLast = currentIndex === items.length - 1;

  let optionsHTML = "";
  item.options.forEach(function (opt, j) {
    optionsHTML +=
      '<label class="option" data-idx="' + j + '">' +
        '<input type="' + inputType + '" name="answer" value="' + j + '">' +
        '<span class="option__num">' + (j + 1) + '</span>' +
        '<span class="option__text">' + escapeHtml(opt.text) + '</span>' +
      '</label>';
  });

  app.innerHTML =
    '<div class="q-head">' +
      '<span class="badge-block" style="--block:' + info.color + ';--block-soft:' + info.soft + '">' +
        info.icon + " " + escapeHtml(info.title) +
      '</span>' +
      '<span class="q-counter">Вопрос ' + (currentIndex + 1) + " / " + items.length + '</span>' +
    '</div>' +

    progressHtml(items.length, currentIndex) +

    '<div class="question">' +
      '<div class="q-type">' + (isMultiple ? "Несколько ответов" : "Один ответ") + '</div>' +
      '<h3>' + escapeHtml(item.question) + '</h3>' +
      '<div id="options">' + optionsHTML + '</div>' +
      '<div class="feedback" id="feedback"></div>' +

      '<div class="actions" id="checkWrap">' +
        '<button class="btn btn--block" id="checkBtn" disabled>Ответить</button>' +
      '</div>' +
      '<div class="actions" id="nextWrap" style="display:none;">' +
        '<button class="btn btn--block" id="nextBtn">' +
          (isLast ? "Показать результат →" : "Следующий вопрос →") +
        '</button>' +
      '</div>' +
    '</div>';

  // Обработчики выбора
  const labels = app.querySelectorAll("label[data-idx]");
  labels.forEach(function (label) {
    const input = label.querySelector("input");
    input.addEventListener("change", function () {
      if (isMultiple) {
        label.classList.toggle("selected", input.checked);
      } else {
        labels.forEach(function (l) { l.classList.remove("selected"); });
        label.classList.add("selected");
      }
      updateCheckBtn();
    });
  });

  document.getElementById("checkBtn").addEventListener("click", checkAnswer);
  document.getElementById("nextBtn").addEventListener("click", nextQuestion);

  updateCheckBtn();
}

// ====== АКТИВНОСТЬ КНОПКИ «ОТВЕТИТЬ» ======
function updateCheckBtn() {
  const selected = document.querySelectorAll('input[name="answer"]:checked');
  const btn = document.getElementById("checkBtn");
  if (btn) btn.disabled = selected.length === 0;
}

// ====== РАЗБОР ОТВЕТА ======
function mistakeListHtml(options, selected, correctIdx) {
  let html = '<div style="margin-top:8px;">';
  options.forEach(function (opt, idx) {
    const wasSelected = selected.includes(idx);
    const isRight = correctIdx.includes(idx);

    if (isRight && wasSelected) {
      html += '<div class="fb-row fb-row--ok"><span class="marks">' + uiIcon("check", 15) +
        '</span>' + escapeHtml(opt.text) + '</div>';
    } else if (isRight) {
      html += '<div class="fb-row fb-row--plus"><span class="marks">' + uiIcon("plus", 15) +
        '</span>' + escapeHtml(opt.text) + ' <i>(пропущен правильный ответ)</i></div>';
    } else if (wasSelected) {
      html += '<div class="fb-row fb-row--bad"><span class="marks">' + uiIcon("cross", 15) +
        '</span>' + escapeHtml(opt.text) + '</div>';
    }
  });
  return html + "</div>";
}

// ====== ПРОВЕРКА ОТВЕТА ======
function checkAnswer() {
  const item = items[currentIndex];

  const inputs = Array.from(document.querySelectorAll('input[name="answer"]'));
  const selected = inputs.filter(function (i) { return i.checked; })
                         .map(function (i) { return parseInt(i.value, 10); });

  const correctIdx = item.options
    .map(function (o, idx) { return o.correct ? idx : -1; })
    .filter(function (i) { return i >= 0; });

  const isCorrect = selected.length === correctIdx.length &&
    selected.every(function (s) { return correctIdx.includes(s); });

  // Подсветка вариантов
  const labels = document.querySelectorAll("label[data-idx]");
  labels.forEach(function (label) {
    const idx = parseInt(label.dataset.idx, 10);
    label.classList.add("disabled");
    label.querySelector("input").disabled = true;

    const wasSelected = selected.includes(idx);
    const isRight = correctIdx.includes(idx);

    if (isRight && wasSelected) label.classList.add("correct-answer");
    else if (isRight && !wasSelected) label.classList.add("missed-answer");
    else if (wasSelected) label.classList.add("wrong-answer");
  });

  // Запоминаем ответ — он нужен для сводки ошибок в конце
  answers.push({
    item: item,
    selected: selected,
    correctIdx: correctIdx,
    isCorrect: isCorrect,
    selectedTexts: selected.map(function (i) { return item.options[i].text; }),
    correctTexts: correctIdx.map(function (i) { return item.options[i].text; })
  });

  const fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (isCorrect ? "ok" : "err");
  fb.innerHTML = isCorrect
    ? '<b><span class="marks">' + uiIcon("check", 16) + '</span>Правильно</b>'
    : '<b><span class="marks">' + uiIcon("cross", 16) + '</span>Неправильно</b>' +
      mistakeListHtml(item.options, selected, correctIdx);

  document.getElementById("checkWrap").style.display = "none";
  document.getElementById("nextWrap").style.display = "block";

  if (isCorrect) topicStats[item.topic].correct++;
}

// ====== СЛЕДУЮЩИЙ ВОПРОС ======
function nextQuestion() {
  currentIndex++;
  renderQuestion();
}

// ====== ФИНАЛ ======
function renderFinal() {
  const app = document.getElementById("app");
  finished = true;

  // Порог есть не у всех: у билетов по видам работ его нет
  const hasThresholds = activeParts.every(function (part) {
    const st = topicStats[part.topic];
    return !st || typeof st.passPercent === "number";
  });

  let allPassed = true;
  let correctTotal = 0;
  let questionsTotal = 0;
  let rows = "";

  for (const part of activeParts) {
    const st = topicStats[part.topic];
    if (!st) continue;

    correctTotal += st.correct;
    questionsTotal += st.total;
    const percent = st.total ? Math.round(st.correct / st.total * 100) : 0;
    const info = blockInfo(part.topic);

    if (hasThresholds) {
      const ok = percent >= st.passPercent;
      if (!ok) allPassed = false;
      rows += '<tr>' +
        '<td><span class="dot" style="background:' + info.color + '"></span>' + escapeHtml(info.title) + '</td>' +
        '<td class="num">' + st.correct + " / " + st.total + '</td>' +
        '<td class="num">' + percent + '%</td>' +
        '<td class="num">порог ' + st.passPercent + '%</td>' +
        '<td class="' + (ok ? "ok" : "fail") + '">' +
          (ok ? uiIcon("check", 15) : uiIcon("cross", 15)) + '</td>' +
      '</tr>';
    } else {
      rows += '<tr>' +
        '<td><span class="dot" style="background:' + info.color + '"></span>' + escapeHtml(info.title) + '</td>' +
        '<td class="num">' + st.correct + " / " + st.total + '</td>' +
        '<td class="num">' + percent + '%</td>' +
      '</tr>';
    }
  }

  const overallPercent = questionsTotal ? Math.round(correctTotal / questionsTotal * 100) : 0;
  const passed100 = !hasThresholds && questionsTotal > 0 && correctTotal === questionsTotal;

  // Запоминаем результат билета — по нему список билетов подсвечивает пройденные
  if (test && test.group === "work" && currentTicket) {
    saveTicketResult(test.id, currentTicket, correctTotal, questionsTotal);
  }

  // тон результата: зелёный / янтарный / красный
  let tone = "err";
  if (hasThresholds) tone = allPassed ? "ok" : "err";
  else if (passed100) tone = "ok";
  else if (overallPercent >= 70) tone = "warn";

  const heading = hasThresholds
    ? (allPassed
        ? '<span class="marks">' + uiIcon("check", 20) + '</span>Тест пройден!'
        : '<span class="marks">' + uiIcon("cross", 20) + '</span>Тест не пройден')
    : (passed100
        ? '<span class="marks">' + uiIcon("check", 20) + '</span>Билет пройден на 100%'
        : 'Тест завершён');

  const subtitle = hasThresholds
    ? (allPassed
        ? "Вы набрали нужный процент по всем темам."
        : "По одной или нескольким темам порог не взят.")
    : (passed100
        ? "Билет отмечен зелёным в списке билетов."
        : "Можно пройти билет заново — отметка останется лучшей.");

  const headRow = hasThresholds
    ? '<tr><th>Тема</th><th>Результат</th><th>Процент</th><th>Порог</th><th></th></tr>'
    : '<tr><th>Тема</th><th>Результат</th><th>Процент</th></tr>';

  // круг с процентом
  const R = 52;
  const C = 2 * Math.PI * R;
  const offset = C * (1 - overallPercent / 100);
  const ring =
    '<div class="score score--' + tone + '">' +
      '<svg class="score__ring" viewBox="0 0 120 120" aria-hidden="true">' +
        '<circle class="score__track" cx="60" cy="60" r="' + R + '"></circle>' +
        '<circle class="score__value" cx="60" cy="60" r="' + R + '" ' +
          'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="score__center">' +
        '<div class="score__percent">' + overallPercent + '%</div>' +
        '<div class="score__sub">' + correctTotal + " из " + questionsTotal + '</div>' +
      '</div>' +
    '</div>';

  // сводка ошибок
  const mistakes = answers.filter(function (a) { return !a.isCorrect; });
  let mistakesHtml = "";

  if (mistakes.length) {
    // разбор ошибок свёрнут, чтобы не листать длинный список
    mistakesHtml = '<details class="mistakes"><summary>' +
      "Ошибки: " + mistakes.length + " из " + questionsTotal + " — показать разбор" +
      '</summary>';

    mistakes.forEach(function (m) {
      mistakesHtml +=
        '<div class="mistake">' +
          '<div class="mistake__q">' + escapeHtml(m.item.question) + '</div>' +
          '<div class="mistake__row mistake__row--bad">' +
            '<span class="mistake__label">Ваш ответ:</span> ' +
            (m.selectedTexts.length ? escapeHtml(m.selectedTexts.join("; ")) : "нет ответа") +
          '</div>' +
          '<div class="mistake__row mistake__row--good">' +
            '<span class="mistake__label">Правильно:</span> ' +
            escapeHtml(m.correctTexts.join("; ")) +
          '</div>' +
        '</div>';
    });

    mistakesHtml += "</details>";
  }

  const isWork = !!(test && test.group === "work");

  app.innerHTML =
    '<div class="final">' +
      '<h2>' + heading + '</h2>' +
      '<div class="final__sub">' + escapeHtml(subtitle) + '</div>' +

      ring +

      '<table class="topic-results">' +
        '<thead>' + headRow + '</thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +

      mistakesHtml +

      '<div class="final-buttons">' +
        '<button class="btn" id="homeBtn"><span class="marks">' + uiIcon("home", 17) +
          '</span>На главную</button>' +
        (isWork
          ? '<button class="btn btn--secondary" id="ticketsBtn"><span class="marks">' +
            uiIcon("list", 17) + '</span>Выбрать другой билет</button>'
          : '') +
        '<button class="btn btn--secondary" id="restartBtn">Пройти заново</button>' +
        '<button class="btn btn--secondary" id="printBtn"><span class="marks">' +
          uiIcon("printer", 17) + '</span>Печать</button>' +
      '</div>' +
    '</div>';

  document.getElementById("restartBtn").addEventListener("click", restartTest);
  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
  document.getElementById("homeBtn").addEventListener("click", goMain);
  if (isWork) {
    document.getElementById("ticketsBtn").addEventListener("click", goTickets);
  }
}

function restartTest() {
  currentIndex = 0;
  buildTest();
  renderQuestion();
}

// К списку билетов блока
function goTickets() {
  window.location.href = "block.html?id=" + encodeURIComponent(test.id);
}

// На главную страницу
function goMain() {
  window.location.href = "index.html";
}

// ====== ОШИБКА ======
function showError(msg, backHref) {
  const href = backHref || "index.html";
  const label = backHref ? "Вернуться к выбору билета" : "Вернуться на главную";
  document.getElementById("app").innerHTML =
    '<div class="error">' +
      '<h2><span class="marks">' + uiIcon("cross", 20) + '</span>Ошибка</h2>' +
      '<p>' + escapeHtml(msg) + '</p>' +
      '<p><a class="link-chip" href="' + href + '">' + '<span class="marks">' + uiIcon("home", 16) + '</span>' + label + '</a></p>' +
    '</div>';
}

// ====== ВЫХОД ИЗ ТЕСТА ======
// Кнопка «На главную» заметная, поэтому посреди теста спрашиваем подтверждение,
// чтобы случайный клик не стёр уже данные ответы
document.getElementById("homeLink").addEventListener("click", function (event) {
  if (!finished && currentIndex > 0) {
    if (!confirm("Выйти из теста? Ответы не сохранятся.")) event.preventDefault();
  }
});

// ====== СТАРТ ======
start();
</script>
</body>
</html>
