<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Внешняя оценка знаний</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<script>
  // тема выбирается до первой отрисовки, чтобы страница не мигала
  try {
    var savedTheme = localStorage.getItem("theme.v1");
    if (!savedTheme) {
      savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="index.html">
      <div class="site-logo">✓</div>
      <div>
        <div class="site-title">Внешняя оценка знаний</div>
        <div class="site-subtitle">Тесты по охране труда</div>
      </div>
    </a>
  </div>
</header>

<main class="page page--hero">
  <div id="app">
    <div class="loading">Загрузка…</div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>Внешняя оценка знаний · тесты по охране труда</span>
    <span>Иконки профессий: Twemoji (CC-BY 4.0)</span>
    <span>Версия от 03.10.2026</span>
  </div>
</footer>

<script src="common.js"></script>
<script>
function renderList(containerId, tests, hrefFor, iconFor) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";

  if (!tests.length) {
    box.innerHTML = '<div class="empty">Пока ничего нет</div>';
    return;
  }

  tests.forEach(function (test) {
    const info = test.group === "work" ? blockInfo(test.topic) : null;

    const a = document.createElement("a");
    a.className = "card-link" + (info ? " card-link--block" : "");
    a.href = hrefFor(test);
    a.dataset.id = test.id;

    if (info) {
      a.style.setProperty("--block", info.color);
      a.style.setProperty("--block-soft", info.soft);
    }

    const meta = document.createElement("span");
    meta.className = "card-link__meta";
    meta.textContent = info ? "Выбор билета" : "";

    a.innerHTML =
      '<span class="card-link__icon">' + (info ? info.icon : iconFor(test)) + '</span>' +
      '<span class="card-link__body"><span class="card-link__title"></span>' + meta.outerHTML + '</span>' +
      '<span class="card-link__chev">›</span>';

    a.querySelector(".card-link__title").textContent = test.title;
    box.appendChild(a);
  });
}

// Одновременно открыт только один раздел:
// клик по заголовку закрывает остальные панели, а свою открывает
// (или закрывает, если она была открыта)
function initAccordion() {
  const headers = Array.from(document.querySelectorAll(".acc-header"));
  const panels = Array.from(document.querySelectorAll(".acc-panel"));

  function closeAll() {
    panels.forEach(function (p) { p.classList.remove("open"); });
    headers.forEach(function (h) {
      h.classList.remove("open");
      h.setAttribute("aria-expanded", "false");
    });
  }

  headers.forEach(function (header) {
    header.addEventListener("click", function () {
      const panel = document.getElementById(header.dataset.target);
      const wasOpen = panel.classList.contains("open");

      closeAll();

      if (!wasOpen) {
        panel.classList.add("open");
        header.classList.add("open");
        header.setAttribute("aria-expanded", "true");
      }
    });
  });
}

// Быстрые действия: случайный билет и короткий блиц
function renderQuick(works, counts) {
  const row = document.getElementById("quickRow");
  if (!row) return;
  row.innerHTML = "";

  const withQuestions = works.filter(function (t) { return (counts[t.topic] || 0) > 0; });

  if (withQuestions.length) {
    const test = withQuestions[Math.floor(Math.random() * withQuestions.length)];
    const ticketCount = splitIntoTickets(counts[test.topic], test.ticketSize).length;
    const number = 1 + Math.floor(Math.random() * ticketCount);

    const random = document.createElement("a");
    random.className = "quick__btn";
    random.href = "test.html?id=" + encodeURIComponent(test.id) + "&ticket=" + number;
    random.innerHTML = uiIcon("dice", 18) + "<span>Случайный билет</span>";
    row.appendChild(random);
  }

  const blitz = document.createElement("a");
  blitz.className = "quick__btn quick__btn--main";
  // блиц по случайному блоку (вариант «все виды работ» убран)
  if (withQuestions.length) {
    const blitzTest = withQuestions[Math.floor(Math.random() * withQuestions.length)];
    blitz.href = "blitz.html?block=" + encodeURIComponent(blitzTest.id) + "&count=20";
  } else {
    blitz.href = "blitz.html";
  }
  blitz.innerHTML = uiIcon("bolt", 18) + "<span>Блиц: 20 вопросов</span>";
  row.appendChild(blitz);
}

// «Продолжить» — последний открытый билет
function renderContinue() {
  const slot = document.getElementById("continueSlot");
  if (!slot) return;
  slot.innerHTML = "";

  const last = loadLastVisit();
  if (!last) return;

  const wrap = document.createElement("div");
  wrap.className = "continue";

  const link = document.createElement("a");
  link.className = "continue__link";
  link.href = last.href;
  link.innerHTML =
    '<span class="continue__body">' +
      '<span class="continue__title"></span>' +
      '<span class="continue__meta">Продолжить с этого места</span>' +
    '</span>';
  link.querySelector(".continue__title").textContent = last.title;

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "continue__x";
  remove.title = "Убрать";
  remove.textContent = "✕";
  remove.addEventListener("click", function () {
    clearLastVisit();
    slot.innerHTML = "";
  });

  wrap.appendChild(link);
  wrap.appendChild(remove);
  slot.appendChild(wrap);
}

// Список блиц-опросов: сначала по видам работ, затем по профессиям
function renderBlitz(works, professions) {
  const box = document.getElementById("blitzList");
  if (!box) return;
  box.innerHTML = "";

  function groupTitle(text) {
    const el = document.createElement("div");
    el.className = "blitz-group";
    el.textContent = text;
    return el;
  }

  function card(title, meta, iconHtml, href, info) {
    const a = document.createElement("a");
    a.className = "card-link" + (info ? " card-link--block" : "");
    a.href = href;

    if (info) {
      a.style.setProperty("--block", info.color);
      a.style.setProperty("--block-soft", info.soft);
    }

    a.innerHTML =
      '<span class="card-link__icon">' + iconHtml + '</span>' +
      '<span class="card-link__body"><span class="card-link__title"></span>' +
        '<span class="card-link__meta"></span></span>' +
      '<span class="card-link__chev">›</span>';

    a.querySelector(".card-link__title").textContent = title;
    a.querySelector(".card-link__meta").textContent = meta;
    return a;
  }

  const worksBox = document.createElement("div");
  worksBox.className = "card-list";
  works.forEach(function (t) {
    const info = blockInfo(t.topic);
    worksBox.appendChild(card(t.title, "Блиц по этому блоку",
      info.icon, "blitz.html?block=" + encodeURIComponent(t.id), info));
  });

  const profBox = document.createElement("div");
  profBox.className = "card-list";
  professions.forEach(function (t) {
    profBox.appendChild(card(t.title, "Блиц по блокам профессии",
      workerIcon(PROFESSION_HELMETS[t.id]), "blitz.html?prof=" + encodeURIComponent(t.id), null));
  });

  box.appendChild(groupTitle("По видам работ"));
  box.appendChild(worksBox);
  box.appendChild(groupTitle("По профессиям"));
  box.appendChild(profBox);
}

// Ссылка «сбросить отметки» — нужна, когда тесты проходят на общем компьютере
function renderResetLink() {
  const app = document.getElementById("app");
  const old = document.getElementById("resetWrap");
  if (old) old.remove();

  if (!hasAnyResults()) return;

  const wrap = document.createElement("div");
  wrap.id = "resetWrap";
  wrap.style.marginTop = "26px";

  const link = document.createElement("a");
  link.className = "link-quiet";
  link.href = "#";
  link.textContent = "Сбросить все отметки о прохождении";
  link.addEventListener("click", function (event) {
    event.preventDefault();
    if (!confirm("Сбросить все отметки о прохождении тестов на этом компьютере?")) return;

    clearAllResults();
    wrap.innerHTML = "";

    const done = document.createElement("div");
    done.className = "note-done";
    done.textContent = "✓ Отметки сброшены";
    wrap.appendChild(done);
  });

  wrap.appendChild(link);
  app.appendChild(wrap);
}

async function loadTests() {
  const app = document.getElementById("app");

  try {
    const loaded = await Promise.all([fetchJson("tests.json"), fetchJson("counts.json")]);
    const tests = loaded[0];
    const counts = (loaded[1] && loaded[1].counts) || {};

    const professions = tests.filter(function (t) { return (t.group || "profession") === "profession"; });
    const works = tests.filter(function (t) { return t.group === "work"; });

    // цифры для плиток на главной
    const totalQuestions = Object.keys(counts).reduce(function (sum, topic) {
      return sum + (counts[topic] || 0);
    }, 0);
    const totalTickets = works.reduce(function (sum, t) {
      return sum + splitIntoTickets(counts[t.topic] || 0, t.ticketSize).length;
    }, 0);
    const totalTopics = professions.length + works.length;

    app.innerHTML =
      '<div id="continueSlot"></div>' +
      '<div class="quick" id="quickRow"></div>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + totalQuestions + '</b><span>' +
          plural(totalQuestions, "вопрос", "вопроса", "вопросов") + '</span></div>' +
        '<div class="stat"><b>' + totalTickets + '</b><span>' +
          plural(totalTickets, "билет", "билета", "билетов") + '</span></div>' +
        '<div class="stat"><b>' + totalTopics + '</b><span>' +
          plural(totalTopics, "тема", "темы", "тем") + '</span></div>' +
      '</div>' +

      '<a class="acc-item memo-row" href="memo.html">' +
        '<span class="acc-header">' +
          '<span class="acc-header__icon" data-icon="aid" data-size="21"></span>' +
          '<span class="memo-row__body">' +
            '<span class="memo-row__title">Памятка по оказанию первой помощи</span>' +
            '<span class="memo-row__meta">Барьер ОЗ.04 · что делать за первые 4 минуты</span>' +
          '</span>' +
          '<span class="card-link__chev">›</span>' +
        '</span>' +
      '</a>' +

      '<div class="accordion">' +

        '<div class="acc-item" style="--acc:#1f6feb;--acc-soft:#eaf1fe">' +
          '<button type="button" class="acc-header" data-target="panel-profession" aria-expanded="false">' +
            '<span class="acc-header__icon" data-icon="helmet" data-size="21"></span>' +
            '<span>Тесты по профессии</span>' +
            '<span class="acc-header__count">' + professions.length + '</span>' +
            '<span class="acc-arrow">▼</span>' +
          '</button>' +
          '<div class="acc-panel" id="panel-profession">' +
            '<div class="acc-panel__inner"><div class="card-list" id="professionList"></div></div>' +
          '</div>' +
        '</div>' +

        '<div class="acc-item" style="--acc:#0891b2;--acc-soft:#e2f5fa">' +
          '<button type="button" class="acc-header" data-target="panel-work" aria-expanded="false">' +
            '<span class="acc-header__icon" data-icon="clipboard" data-size="21"></span>' +
            '<span>Тесты по видам работ</span>' +
            '<span class="acc-header__count">' + works.length + '</span>' +
            '<span class="acc-arrow">▼</span>' +
          '</button>' +
          '<div class="acc-panel" id="panel-work">' +
            '<div class="acc-panel__inner"><div class="card-list" id="workList"></div></div>' +
          '</div>' +
        '</div>' +

        '<div class="acc-item" style="--acc:#ea580c;--acc-soft:#feece3">' +
          '<button type="button" class="acc-header" data-target="panel-blitz" aria-expanded="false">' +
            '<span class="acc-header__icon" data-icon="bolt" data-size="21"></span>' +
            '<span>Блиц-опрос</span>' +
            '<span class="acc-header__count">' + (works.length + professions.length) + '</span>' +
            '<span class="acc-arrow">▼</span>' +
          '</button>' +
          '<div class="acc-panel" id="panel-blitz">' +
            '<div class="acc-panel__inner"><div id="blitzList"></div></div>' +
          '</div>' +
        '</div>' +

      '</div>';

    renderList("professionList", professions, function (t) {
      return "test.html?id=" + encodeURIComponent(t.id);
    }, function (t) {
      return workerIcon(PROFESSION_HELMETS[t.id]);
    });

    renderList("workList", works, function (t) {
      return "block.html?id=" + encodeURIComponent(t.id);
    }, function () {
      return uiIcon("clipboard", 20);
    });

    initAccordion();
    fillIcons(app);
    renderQuick(works, counts);
    renderContinue();
    renderBlitz(works, professions);
    renderResetLink();

  } catch (e) {
    app.innerHTML =
      '<div class="error-box">' + uiIcon("cross", 18) + ' Ошибка: ' + escapeHtml(e.message) + '<br>' +
      'Проверь, что файл <b>tests.json</b> лежит рядом с <b>index.html</b>, ' +
      'и что сайт открывается через сервер, а не как file://</div>';
  }
}

loadTests();
</script>
</body>
</html>
