<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Онлайн-тестирование</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f0f2f5; color: #1a1a1a;
    margin: 0; padding: 40px 20px;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .container { max-width: 520px; width: 100%; }
  h1 {
    text-align: center; color: #1a1a1a;
    font-size: 28px; margin: 0 0 30px;
    font-weight: 600;
  }
  .test-list { display: flex; flex-direction: column; gap: 14px; }
  .test-btn {
    display: block; width: 100%;
    padding: 20px 24px;
    background: #fff; color: #1a1a1a;
    border: 2px solid #e0e0e0; border-radius: 12px;
    font-size: 17px; font-weight: 500;
    text-align: left; cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .test-btn:hover {
    border-color: #0066cc;
    background: #eef4ff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,102,204,0.15);
  }
  .test-btn::after {
    content: "→";
    float: right;
    color: #0066cc;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .test-btn:hover::after { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <h1>Онлайн-тестирование</h1>
  <div class="test-list" id="testList">
    <div style="text-align:center; padding:20px; color:#888;">Загрузка...</div>
  </div>
</div>

<script>
async function loadTests() {
  try {
    const resp = await fetch("tests.json");
    if (!resp.ok) throw new Error("Не найден tests.json");
    const tests = await resp.json();

    const list = document.getElementById("testList");
    list.innerHTML = "";

    tests.forEach(test => {
      const a = document.createElement("a");
      a.className = "test-btn";
      a.href = `test.html?id=${encodeURIComponent(test.id)}`;
      a.textContent = test.title;
      list.appendChild(a);
    });
  } catch (e) {
    document.getElementById("testList").innerHTML =
      `<div style="color:#c62828; padding:20px; text-align:center;">
        ❌ Ошибка: ${e.message}<br>
        Проверь, что файл <code>tests.json</code> рядом с <code>index.html</code>,
        и что ты открываешь через сервер (не file://).
      </div>`;
  }
}
loadTests();
</script>
</body>
</html>
