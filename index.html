<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Электрогазосварщик</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 800px; margin: 0 auto; padding: 20px;
    background: #f0f2f5; color: #1a1a1a; line-height: 1.5;
  }
  h1 { text-align: center; color: #0066cc; }
  .intro { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .intro p { margin: 8px 0; }
  .question {
    background: #fff; padding: 20px; margin-bottom: 15px;
    border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .question h3 { margin: 0 0 15px; font-size: 17px; }
  label {
    display: block; padding: 12px 15px; margin: 8px 0;
    cursor: pointer; border-radius: 8px; border: 2px solid #e0e0e0;
    transition: all 0.15s;
  }
  label:hover { background: #eef4ff; border-color: #0066cc; }
  label.selected { background: #eef4ff; border-color: #0066cc; }
  input[type="radio"] { margin-right: 10px; }
  .progress { text-align: center; color: #666; margin-bottom: 15px; font-size: 14px; }
  button {
    display: block; width: 100%; padding: 15px; font-size: 17px;
    background: #0066cc; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; font-weight: 600; margin-top: 20px;
  }
  button:hover { background: #0055aa; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #result {
    margin-top: 20px; padding: 25px; border-radius: 10px;
    font-size: 18px; display: none; text-align: center;
  }
  .correct { background: #d4edda; color: #155724; }
  .wrong { background: #f8d7da; color: #721c24; }
  .review { margin-top: 20px; text-align: left; }
  .review-item { padding: 12px; margin: 8px 0; border-radius: 6px; font-size: 14px; }
  .review-item.ok { background: #e8f5e9; border-left: 4px solid #4caf50; }
  .review-item.err { background: #ffebee; border-left: 4px solid #f44336; }
  .answer-correct { color: #2e7d32; font-weight: 600; }
  .answer-wrong { color: #c62828; text-decoration: line-through; }
</style>
</head>
<body>

<h1>Тест: Электрогазосварщик</h1>

<div class="intro">
  <p><b>Инструкция:</b> выберите один правильный ответ в каждом вопросе. Порог прохождения — 70%.</p>
  <p><b>Всего вопросов:</b> <span id="total">0</span></p>
</div>

<div class="progress">Отвечено: <span id="answered">0</span> из <span id="total2">0</span></div>
<div id="quiz"></div>
<button id="checkBtn" onclick="checkAnswers()" disabled>Проверить результат</button>
<div id="result"></div>

<script>
// ===== БАЗА ВОПРОСОВ =====
// Добавляй сюда сколько угодно вопросов.
// correct — индекс правильного ответа (0 = первый, 1 = второй и т.д.)
const questions = [
  {
    q: "Какой аппарат преобразует переменный ток одного напряжения в переменный ток другого напряжения?",
    options: ["Сварочный выпрямитель", "Сварочный трансформатор", "Сварочный генератор", "Сварочный преобразователь"],
    correct: 1
  },
  {
    q: "Для какого вида сварки используются сварочные выпрямители?",
    options: ["Сварка переменным током", "Сварка постоянным током", "Сварка на прямой полярности"],
    correct: 1
  },
  {
    q: "На какой полярности обеспечивается большее проплавление основного металла?",
    options: ["На прямой", "На обратной", "Одинаково"],
    correct: 1
  },
  {
    q: "С какой группой по электробезопасности допускаются электросварщики?",
    options: ["Не ниже второй", "С любой", "Не ниже третьей"],
    correct: 0
  },
  {
    q: "Листы какой толщины можно сваривать без разделки кромок?",
    options: ["16 мм", "8 мм", "4 мм"],
    correct: 2
  },
  {
    q: "Какой дефект связан с отсутствием сплавления между основным металлом и швом?",
    options: ["Шлаковые включения", "Непровар", "Поры", "Трещины"],
    correct: 1
  },
  {
    q: "Сроки повторного инструктажа на работах с повышенной опасностью:",
    options: ["1 раз в 3 месяца", "1 раз в 6 месяцев", "1 раз в 12 месяцев"],
    correct: 0
  }
];

// ===== ЛОГИКА (не трогай без необходимости) =====
const PASS_PERCENT = 70;
const quizDiv = document.getElementById('quiz');
const checkBtn = document.getElementById('checkBtn');
const resultDiv = document.getElementById('result');

document.getElementById('total').textContent = questions.length;
document.getElementById('total2').textContent = questions.length;

// Рендер вопросов
questions.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'question';
  div.innerHTML = `<h3>${i + 1}. ${item.q}</h3>`;
  item.options.forEach((opt, j) => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="radio" name="q${i}" value="${j}"> ${opt}`;
    label.addEventListener('click', () => {
      div.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      updateProgress();
    });
    div.appendChild(label);
  });
  quizDiv.appendChild(div);
});

function updateProgress() {
  const answered = questions.filter((_, i) =>
    document.querySelector(`input[name="q${i}"]:checked`)
  ).length;
  document.getElementById('answered').textContent = answered;
  checkBtn.disabled = answered < questions.length;
}

function checkAnswers() {
  let score = 0;
  let reviewHTML = '<div class="review"><h3>Разбор ответов:</h3>';

  questions.forEach((item, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const userAnswer = selected ? parseInt(selected.value) : -1;
    const isCorrect = userAnswer === item.correct;
    if (isCorrect) score++;

    reviewHTML += `<div class="review-item ${isCorrect ? 'ok' : 'err'}">`;
    reviewHTML += `<b>${i + 1}. ${item.q}</b><br>`;
    if (!isCorrect) {
      reviewHTML += `Ваш ответ: <span class="answer-wrong">${item.options[userAnswer] || '—'}</span><br>`;
    }
    reviewHTML += `Правильный ответ: <span class="answer-correct">${item.options[item.correct]}</span>`;
    reviewHTML += `</div>`;
  });
  reviewHTML += '</div>';

  const percent = Math.round(score / questions.length * 100);
  resultDiv.style.display = 'block';
  resultDiv.className = percent >= PASS_PERCENT ? 'correct' : 'wrong';
  resultDiv.innerHTML =
    `<div style="font-size:24px; margin-bottom:10px;">${percent >= PASS_PERCENT ? '✅' : '❌'}</div>` +
    `<b>Правильных ответов: ${score} из ${questions.length}</b><br>` +
    `Результат: <b>${percent}%</b><br>` +
    (percent >= PASS_PERCENT
      ? 'Тест пройден!'
      : `Тест не пройден. Порог: ${PASS_PERCENT}%.`) +
    reviewHTML;

  resultDiv.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
