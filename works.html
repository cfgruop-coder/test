<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тесты по видам работ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css?v=9">
<script>
  // тема выбирается до первой отрисовки, чтобы страница не мигала
  try {
    var savedTheme = localStorage.getItem("theme.v1");
    // светлая тема по умолчанию; тёмная — только если её выбрал сам пользователь
    document.documentElement.setAttribute("data-theme", savedTheme === "dark" ? "dark" : "light");
  } catch (e) {}
</script>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="index.html">
      <div class="site-logo">✓</div>
      <div>
        <div class="site-title">Внешняя оценка знаний</div>
        <div class="site-subtitle">Тесты по охране труда</div>
      </div>
    </a>
  </div>
</header>

<main class="page page--wide">
  <div class="top-nav"><a class="link-chip" href="index.html"><span class="marks" data-icon="home" data-size="16"></span>На главную</a></div>
  <h1 class="page-title">Тесты по видам работ</h1>
  <p class="page-sub">Выберите блок — внутри билеты по 20 вопросов</p>
  <div class="card-list" id="list">
    <div class="skeleton">
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
      <div class="skeleton__row"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>Внешняя оценка знаний · тесты по охране труда</span>
    <span>Версия от 03.10.2026</span>
  </div>
</footer>

<script src="common.js?v=6"></script>
<script>
// карточка блока: своя иконка и цвет блока, число билетов и вопросов
function card(title, meta, iconHtml, href, info) {
  const a = document.createElement("a");
  a.className = "card-link card-link--block";
  a.href = href;

  if (info) {
    a.style.setProperty("--block", info.color);
    a.style.setProperty("--block-soft", info.soft);
  }

  a.innerHTML =
    '<span class="card-link__icon">' + iconHtml + '</span>' +
    '<span class="card-link__body"><span class="card-link__title"></span>' +
      '<span class="card-link__meta"></span></span>' +
    '<span class="card-link__chev">›</span>';
  a.querySelector(".card-link__title").textContent = title;
  a.querySelector(".card-link__meta").textContent = meta;
  return a;
}

async function load() {
  const tests = await fetchJson("tests.json");
  const counts = await fetchJson("counts.json");
  const works = tests.filter(function (t) {
    return (t.group || "profession") === "work";
  });

  const box = document.getElementById("list");
  box.innerHTML = "";

  works.forEach(function (t) {
    const info = blockInfo(t.topic);
    const total = counts.counts[t.topic];
    const tickets = splitIntoTickets(total, t.ticketSize).length;

    box.appendChild(card(
      t.title,
      tickets + " " + plural(tickets, "билет", "билета", "билетов") + " · " +
        total + " " + plural(total, "вопрос", "вопроса", "вопросов"),
      info.icon,
      "block.html?id=" + encodeURIComponent(t.id),
      info
    ));
  });

  fillIcons(box);
}

load().catch(function (e) {
  document.getElementById("list").innerHTML =
    '<div class="error-box">Ошибка: ' + escapeHtml(e.message) + '<br>' +
    'Проверь, что файлы <b>tests.json</b> и <b>counts.json</b> лежат рядом со страницей.</div>';
});
</script>
</body>
</html>
